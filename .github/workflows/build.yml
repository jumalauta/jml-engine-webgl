# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          tool_server/package-lock.json
    - run: npm ci
    - run: cd tool_server && npm ci
    - run: npm test
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          tool_server/package-lock.json
    - run: npm ci && npm audit --audit-level=moderate
    - run: cd tool_server && npm ci && npm audit --audit-level=moderate
    - run: cd change-favicon && npm ci && npm audit --audit-level=moderate
    - run: npx prettier --check src/ tool_server/ change-favicon/
    - run: npx eslint --max-warnings 0 src/ tool_server/ change-favicon/
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          tool_server/package-lock.json
    - run: npm ci
    - run: cd tool_server && npm ci
    - run: npx vite build && mv dist release-node
    - name: Upload Node Release
      uses: actions/upload-artifact@v4.6.0
      if: github.event_name != 'release'
      with:
        name: release-node
        path: 'release-node/'
    - run: zip -r release-node.zip release-node
      if: github.event_name == 'release'
    - name: Upload Release Asset
      uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
      if: github.event_name == 'release'
      with:
        files: release-node.zip
